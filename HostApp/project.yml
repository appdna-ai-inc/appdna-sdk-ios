# XcodeGen spec for the iOS host app.
#
# SPM cannot build a runnable .app, and XCUITest needs an application target to attach to, so the
# host lives in a GENERATED Xcode project rather than a committed one: an .xcodeproj is a large
# binary-ish blob that nobody can review in a diff, and this file is eleven lines that anybody can.
#
#     xcodegen generate --spec HostApp/project.yml --project HostApp
#
# The SDK is a LOCAL package reference, so a branch build is what runs — the whole point.
name: AppDNAHost
options:
  bundleIdPrefix: ai.appdna
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  AppDNASDK:
    path: ".."
targets:
  AppDNAHost:
    type: application
    platform: iOS
    sources:
      - AppDNAHost
    info:
      path: AppDNAHost/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: AppDNA Host
        # 🔴 WRITTEN EXPLICITLY, not left to Xcode's implicit injection. A target with its own
        # INFOPLIST_FILE and `GENERATE_INFOPLIST_FILE: NO` gets `CFBundleIdentifier` only if the
        # key is in the file; when it is absent the build still SUCCEEDS and the install fails at
        # `Simulator device failed to install the application. Missing bundle ID.` — which reads
        # like a broken simulator rather than a missing key, and cost a simulator erase and six
        # runs to pin down. Measured 2026-10-21.
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        # Honoured only in a debuggable build (APIBaseURL.infoPlistKey). Patched at RUN time by
        # `scripts/sdk-host-ios.ts`, never committed with a real value — this directory is mirrored
        # to the public SDK repo.
        AppDNABaseURLOverride: "$(APPDNA_BASE_URL_OVERRIDE)"
        # A DEVICE-WALK build's key and menu (`WalkMenu.swift`), so a tester who opens the app from the
        # home screen — or a push that cold-launches it — gets the walk's key and surfaces without a
        # launch argument. Both empty here (a stock build is unchanged); supplied at build time only,
        # never committed — this directory is mirrored to the public SDK repo.
        AppDNAHostApiKey: "$(APPDNA_HOST_API_KEY)"
        AppDNAWalkMenu: "$(APPDNA_WALK_MENU)"
        # the App Group the extension hands its confirmed deliveries over through (`push_delivered`). Empty in a
        # stock build (no hand-off); a walk build supplies it with the matching application-groups entitlement.
        AppDNAAppGroup: "$(APPDNA_APP_GROUP)"
        # A synthetic sample scheme (the Android sample's `appdnasample`), so a custom-scheme in-app CTA
        # or push deep link is an allowed deep link back into this host (`URLSafety.hostSchemes`) and
        # reaches `AppDNA.deepLinks.handleURL` through `onOpenURL`.
        CFBundleURLTypes:
          - CFBundleURLName: ai.appdna.sample
            CFBundleURLSchemes: [appdnasample]
        # A content-available push may LAUNCH the host in the background (no foreground scene), the
        # way a real app is woken by a silent push. The SDK configures there with no window to draw
        # in, so a walk can exercise what it does with a journey message that arrives meanwhile and
        # is drawn when the user next opens the app.
        #
        # 🔴 BOTH modes. `simctl push` with `content-available` to a TERMINATED app asks SpringBoard
        # for a launch with `event_type = background_fetch`, so with `remote-notification` alone the
        # simulator refuses it: "Unable to launch … because this app doesn't declare the proper
        # UIBackgroundMode" (FBSOpenApplicationErrorDomain 5, "Disabled"), and the app never starts.
        # Measured 2026-11-13.
        UIBackgroundModes: [remote-notification, fetch]
    settings:
      base:
        # The Firebase project already has an iOS app registered for exactly this purpose
        # (`ai.appdna.appdnaSdkExample`), so the host reuses it rather than registering another —
        # and never borrows a CUSTOMER's app id, which would also pollute their Installations
        # metrics. The SDK looks for `GoogleService-Info-AppDNA.plist` in the main bundle; that
        # file carries the project's client API key and is written into the built .app at RUN time
        # by `scripts/sdk-host-ios.ts`, never committed — this directory is a public mirror.
        PRODUCT_BUNDLE_IDENTIFIER: ai.appdna.appdnaSdkExample
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # A StoreKit configuration makes the SIMULATOR serve real-shaped products with no App Store
        # Connect account — the only way to ask "does the paywall show the STORE's price, or the
        # one an author typed?" without shipping to a customer. Priced deliberately differently
        # from anything a test paywall authors, so the two can never be confused.
        #
        # 🔴 THIS SETTING ONLY COPIES THE FILE INTO THE BUNDLE. It does NOT switch the simulator's
        # store over to it — that is a SCHEME option, `storeKitConfiguration` under `run:` and
        # `test:` below, which is what Xcode writes when you pick a configuration in the Run
        # dialog. Without those two lines the catalogue ships inside the .app and nothing reads it:
        # the SDK asks StoreKit for its products, gets an empty answer, falls back to the authored
        # price, and the screen looks exactly as it did before the feature existed. Measured on
        # "the store knows none of 2 product(s)" with the file sitting in the bundle.
        #
        # 🔴 Folded into THIS block rather than added as a second `settings:` on the target. YAML
        # takes the later duplicate key, so a second block would have silently discarded the bundle
        # identifier above — and the build would have succeeded, under the wrong id.
        STOREKIT_CONFIGURATION: AppDNAHost/Products.storekit
    dependencies:
      - package: AppDNASDK
        product: AppDNASDK
      # The synthetic widget the `add_widget` walk teaches and detects, embedded in PlugIns.
      - target: AppDNAHostWidget
      # the Notification Service Extension a real app adds: it confirms delivery while the app is not running.
      - target: AppDNAHostNotificationService
  AppDNAHostNotificationService:
    type: app-extension
    platform: iOS
    sources: [AppDNAHostNotificationService]
    info:
      path: AppDNAHostNotificationService/Info.plist
      properties:
        CFBundleDisplayName: NotificationService
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        AppDNAAppGroup: "$(APPDNA_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.appdna.appdnaSdkExample.NotificationService
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        # The extension links only the extension-safe library, as the docs give.
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: AppDNASDK
        product: AppDNANotificationExtension
  # A minimal synthetic WidgetKit extension (`AppDNAHostWidget/SampleWidget.swift`). The SDK's
  # `WidgetHostProbe` finds it by its extension point in the app's PlugIns.
  AppDNAHostWidget:
    type: app-extension
    platform: iOS
    sources: [AppDNAHostWidget]
    info:
      path: AppDNAHostWidget/Info.plist
      # Only the extension point here; Xcode generates the rest (the widget template's own shape).
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.appdna.appdnaSdkExample.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sample widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  # THE SAME HOST WITHOUT A WIDGET. Built from the same app sources and NOT embedding
  # `AppDNAHostWidget`, so the `add_widget` button's "this app has no widget" branch
  # (`widget_status: unavailable`) can be walked on a real install. A different bundle id, so both can
  # sit on one simulator; a UI test launches it by that id.
  AppDNAHostNoWidget:
    type: application
    platform: iOS
    sources:
      - path: AppDNAHost
        excludes: [Info.plist]
    info:
      path: AppDNAHostNoWidget/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: AppDNA Host (no widget)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        AppDNABaseURLOverride: "$(APPDNA_BASE_URL_OVERRIDE)"
        AppDNAHostApiKey: "$(APPDNA_HOST_API_KEY)"
        AppDNAWalkMenu: "$(APPDNA_WALK_MENU)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.appdna.sample
            CFBundleURLSchemes: [appdnasample]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.appdna.appdnaSdkExample.nowidget
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: AppDNASDK
        product: AppDNASDK
  # AN APP-HOSTED UNIT-TEST TARGET.
  #
  # 🔴 The package's own test target is HOSTLESS, and that is the whole limitation these three
  # issues kept hitting: `SKTestSession.buyProduct(identifier:)` and `Product.purchase()` both fail
  # there with an unknown StoreKit error, so a trial could never be CONSUMED to manufacture the
  # ineligible state, and a purchase could never be driven. `StoreKitSessionTests.probePurchasesWork`
  # already probes for it and skips.
  #
  # A unit-test bundle with a TEST_HOST runs INSIDE the app process, which is the condition those
  # APIs want. It is a separate target from the UI tests on purpose: a UI test drives the app from
  # OUTSIDE it, so it cannot hold an `SKTestSession` at all.
  AppDNAHostTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppDNAHostTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.appdna.appdnaSdkExample.tests
        # Run inside the host app's process — the point of the target.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AppDNAHost.app/AppDNAHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      # 🔴 THE HOST ONLY. Adding `package: AppDNASDK` here makes the test bundle re-link the whole
      # SDK and its transitive Firebase/gRPC, which fails at `ld: symbol(s) not found for
      # architecture arm64` — measured. A hosted test bundle resolves the app's symbols through
      # BUNDLE_LOADER at load time; it must not link them a second time.
      - target: AppDNAHost
      # `link: false` is the hosted-test pattern: the module is on the search path so
      # `@testable import AppDNASDK` resolves, and the SYMBOLS come from the host at load time.
      # Linking it here instead re-links Firebase/gRPC into the bundle and fails at
      # `ld: symbol(s) not found for architecture arm64` — measured.
      - package: AppDNASDK
        product: AppDNASDK
        link: false

  AppDNAHostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppDNAHostUITests
      # The catalogue, as a RESOURCE of the UI-test bundle, so a UI test can hold an
      # `SKTestSession` over it. The hosted unit-test target reaches the copy inside the host .app;
      # a UI-test bundle is installed separately and sees neither the host's resources nor the
      # package's, so `Bundle(for:).url(forResource:)` found nothing and the test skipped.
      - path: AppDNAHost/AppDNATestProducts.storekit
        buildPhase: resources
      # The HOST's catalogue too, because the purchase walk buys a product a real paywall
      # plan references (`premium_monthly`), and the session has to serve that id rather than the
      # trial fixture's.
      - path: AppDNAHost/Products.storekit
        buildPhase: resources
    settings:
      base:
        # A UI-test bundle is code-signed and so needs an Info.plist. The app target brings its own
        # (it carries the base-URL override key); this one has nothing to say, so Xcode generates
        # it. Without this the build fails at the SIGNING step with a message about the Info.plist,
        # which reads like a missing file rather than a missing setting.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.appdna.appdnaSdkExample.uitests
        TEST_TARGET_NAME: AppDNAHost
    dependencies:
      - target: AppDNAHost
schemes:
  AppDNAHostNoWidget:
    build:
      targets:
        AppDNAHostNoWidget: all
    run:
      config: Debug
  AppDNAHost:
    build:
      targets:
        AppDNAHost: all
        AppDNAHostTests: [test]
        AppDNAHostUITests: [test]
    run:
      config: Debug
      # The line that actually switches the simulator's store over (see the build setting above).
      storeKitConfiguration: AppDNAHost/Products.storekit
    test:
      config: Debug
      # 🔴 THE TEST ACTION NEEDS A TEST PLAN, not this key. XcodeGen accepts
      # `storeKitConfiguration:` here and writes it into `<LaunchAction>` only, so a UI test ran
      # against an EMPTY store: the host's own `Product.products(for:)` probe reported `store:0`
      # with the catalogue sitting in the bundle and the scheme referencing it for Run. A test plan
      # is the mechanism Apple documents for this, and `xcodebuild` refuses `-testPlan` unless the
      # scheme declares one — which is what `testPlans:` below does.
      testPlans:
        - path: HostApp.xctestplan
          defaultPlan: true
      targets: [AppDNAHostTests, AppDNAHostUITests]
